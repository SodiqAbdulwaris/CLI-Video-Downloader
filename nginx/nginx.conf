# ─────────────────────────────────────────────────────────────────────────────
# nginx reverse proxy — serves static frontend, proxies /api/* to FastAPI,
# terminates TLS with mkcert-generated certificates.
#
# Cert files expected at (bind-mounted via Compose):
#   /etc/nginx/certs/ytdownloader.local.pem
#   /etc/nginx/certs/ytdownloader.local-key.pem
# ─────────────────────────────────────────────────────────────────────────────

# ── HTTP → HTTPS redirect ─────────────────────────────────────────────────────
server {
    listen 80;
    server_name ytdownloader.local;

    # Redirect all plain-HTTP traffic to HTTPS
    return 301 https://$host$request_uri;
}

# ── HTTPS virtual host ────────────────────────────────────────────────────────
server {
    listen 443 ssl;
    http2  on;
    server_name ytdownloader.local;

    # ── TLS ──────────────────────────────────────────────────────────────────
    ssl_certificate     /etc/nginx/certs/ytdownloader.local.pem;
    ssl_certificate_key /etc/nginx/certs/ytdownloader.local-key.pem;

    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    # ── Security headers ──────────────────────────────────────────────────────
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;

    # ── Static frontend files ─────────────────────────────────────────────────
    root  /usr/share/nginx/html;
    index index.html;

    # SPA fallback — unknown paths → index.html so React Router works
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ── WebSocket proxy (/api/ws/*) ───────────────────────────────────────────
    # Must be declared BEFORE the generic /api/ block so nginx picks the more
    # specific prefix first.
    location /api/ws/ {
        proxy_pass         http://backend:8000;
        proxy_http_version 1.1;

        # WebSocket upgrade headers — required; default proxy_pass does NOT
        # forward them, which would leave the connection stuck at HTTP/1.1.
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection "upgrade";

        proxy_set_header   Host            $host;
        proxy_set_header   X-Real-IP       $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # Downloads can take minutes — keep the WS connection alive.
        proxy_read_timeout  3600s;
        proxy_send_timeout  3600s;
    }

    # ── REST API proxy (/api/*) ───────────────────────────────────────────────
    location /api/ {
        proxy_pass         http://backend:8000;
        proxy_http_version 1.1;

        proxy_set_header   Host            $host;
        proxy_set_header   X-Real-IP       $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # Allow large request bodies (playlist downloads with many indices)
        client_max_body_size 10m;

        # Generous timeouts for slow resolves / long downloads
        proxy_connect_timeout 10s;
        proxy_read_timeout    300s;
        proxy_send_timeout    300s;
    }
}
