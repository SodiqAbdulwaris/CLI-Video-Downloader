services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile

    environment:
      BGUTIL_BASE_URL: http://bgutil:4416
      
    ports:
      - "8000:8000"

    volumes:
      - ./backend/data:/app/backend/data
      - ./backend/config:/app/backend/config

  bgutil:
    image: brainicism/bgutil-ytdlp-pot-provider:1.3.1